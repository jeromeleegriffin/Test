<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot picker phone review</title>
<style>body{margin:16px;background:#20242a;color:white;font:14px system-ui}header{display:flex;gap:8px;align-items:center;margin-bottom:12px}button{padding:10px;cursor:pointer}iframe{display:block;border:1px solid #9a865b;background:#111;width:393px;height:740px}</style>
<header><span>Viewport:</span><button data-size="393,740">393 × 740</button><button data-size="320,568">320 × 568</button><button data-size="430,740">430 × 740</button><button data-size="740,320">740 × 320</button><button data-size="768,900">768 × 900</button></header>
<iframe title="Phone game" src="../../index.html"></iframe>
<script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';};</script>
