name: Format isolated artwork candidate
on:
  push:
    branches: [work/asset-recovery-20261021]
    paths: [.github/workflows/artwork-format-once.yml]
permissions:
  contents: write
jobs:
  format-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write asset-loading772.js
      - name: Commit formatting only to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-loading772.js
          if ! git diff --cached --quiet; then
            git commit -m "Format isolated artwork recovery source [skip ci]"
            git fetch origin work/asset-recovery-20261021
            git rebase origin/work/asset-recovery-20261021
            git push origin HEAD:work/asset-recovery-20261021
          fi
