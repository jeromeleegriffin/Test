name: Premium UI isolated browser QA
on:
  push:
    branches: [work/premium-ui-final-integration-20261020]
    paths: ['coordination/premium-ui-final-20261020/qa_loader_acceptance.py', 'coordination/premium-ui-final-20261020/qa_integrated.py', '.github/workflows/premium-ui-browser-qa.yml']
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - name: Exact game ZIP in unchanged original Loader and text stress
        if: always()
        run: python coordination/premium-ui-final-20261020/qa_loader_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-final-acceptance
          path: |
            coordination/premium-ui-final-20261020/browser-results/
            coordination/premium-ui-final-20261020/loader-acceptance/
      - name: Preserve acceptance evidence on isolated branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coordination/premium-ui-final-20261020/browser-results coordination/premium-ui-final-20261020/loader-acceptance
          git diff --cached --quiet || git commit -m 'Preserve actual Moon, Loader and text stress acceptance evidence'
          git push origin HEAD:work/premium-ui-final-integration-20261020
