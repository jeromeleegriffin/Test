name: Premium UI isolated browser QA
on:
  push:
    branches: [work/premium-ui-final-integration-20261020]
    paths:
      - 'coordination/premium-ui-final-20261020/qa_integrated.py'
      - 'coordination/premium-ui-final-20261020/source-payload/**'
      - '.github/workflows/premium-ui-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact isolated source
        run: |
          cat coordination/premium-ui-final-20261020/source-payload/source-*.part > /tmp/premium-ui.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected=Path('coordination/premium-ui-final-20261020/source-payload/patch.sha256').read_text().strip()
          assert hashlib.sha256(Path('/tmp/premium-ui.patch').read_bytes()).hexdigest()==expected
          PY
          if ! test -f house-premium-ui.js; then
            git apply --exclude=.github/workflows/premium-ui-browser-qa.yml --exclude=coordination/premium-ui-final-20261020/qa_integrated.py /tmp/premium-ui.patch
          fi
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - run: python coordination/premium-ui-final-20261020/qa_integrated.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-ui-real-hand-screenshots
          path: coordination/premium-ui-final-20261020/browser-results/
      - name: Preserve exact source and QA evidence on isolated branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game060.js index.html sw060.js house-premium-ui.js house-premium-ui.css fullscreen-portrait-review.js fullscreen-portrait-review.css assets/house-premium-console brain/versions/AF/files/01_MASTER_BANK/MASTER_BRAIN_AF.md coordination/premium-ui-final-20261020
          git diff --cached --quiet || git commit -m 'Preserve exact premium integration and actual browser QA evidence'
          git push origin HEAD:work/premium-ui-final-integration-20261020
