name: Premium UI isolated browser QA
on:
  push:
    branches: [work/premium-ui-final-integration-20261020]
    paths:
      - 'coordination/premium-ui-final-20261020/qa_integrated.py'
      - '.github/workflows/premium-ui-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [360, 393, 430]
        installed: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game060.js');p.write_text(p.read_text().replace('846-complete-repairs-20261019','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc1','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc2','846-premium-portrait-20261020-rc3'))
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write game060.js index.html sw060.js hor-version.js house-premium-ui.js house-premium-ui.css fullscreen-portrait-review.js fullscreen-portrait-review.css asset-loading772.js progression.js
          npm run check
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - name: Actual hand and visual-state tests
        env:
          QA_WIDTH: '${{ matrix.width }}'
          QA_INSTALLED: '${{ matrix.installed }}'
          QA_MOON: "${{ matrix.width == 393 && matrix.installed == 'true' && 'true' || 'false' }}"
        run: python coordination/premium-ui-final-20261020/qa_integrated.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-ui-${{ matrix.width }}-${{ matrix.installed }}
          path: |
            coordination/premium-ui-final-20261020/browser-results/${{ matrix.width }}-${{ matrix.installed == 'true' && 'installed-simulation' || 'browser' }}-*.png
            coordination/premium-ui-final-20261020/browser-results/RESULTS-${{ matrix.width }}-${{ matrix.installed == 'true' && 'installed-simulation' || 'browser' }}.json
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game060.js');p.write_text(p.read_text().replace('846-complete-repairs-20261019','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc1','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc2','846-premium-portrait-20261020-rc3'))
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write game060.js index.html sw060.js hor-version.js house-premium-ui.js house-premium-ui.css fullscreen-portrait-review.js fullscreen-portrait-review.css asset-loading772.js progression.js
          npm run check
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - name: Unchanged ZIP Loader and live-text/short-screen checks
        run: python coordination/premium-ui-final-20261020/qa_loader_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-ui-loader
          path: coordination/premium-ui-final-20261020/loader-acceptance/
  preserve:
    if: always()
    needs: [browser, loader]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare same formatted candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game060.js');p.write_text(p.read_text().replace('846-complete-repairs-20261019','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc1','846-premium-portrait-20261020-rc3').replace('846-premium-portrait-20261020-rc2','846-premium-portrait-20261020-rc3'))
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write game060.js index.html sw060.js hor-version.js house-premium-ui.js house-premium-ui.css fullscreen-portrait-review.js fullscreen-portrait-review.css asset-loading772.js progression.js
      - uses: actions/download-artifact@v4
        with:
          pattern: premium-ui-*
          merge-multiple: true
          path: coordination/premium-ui-final-20261020/browser-results/
      - name: Preserve candidate and actual QA evidence on isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game060.js index.html sw060.js hor-version.js house-premium-ui.js house-premium-ui.css fullscreen-portrait-review.js fullscreen-portrait-review.css asset-loading772.js progression.js coordination/premium-ui-final-20261020/browser-results
          git diff --cached --quiet || git commit -m 'Preserve formatted premium RC1 source and browser matrix evidence'
          git push origin HEAD:work/premium-ui-final-integration-20261020
