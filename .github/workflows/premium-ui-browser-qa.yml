name: Premium UI isolated browser QA
on:
  push:
    branches: [work/premium-ui-final-integration-20261020]
    paths: ['coordination/premium-ui-final-20261020/qa_startup_probe.py', '.github/workflows/premium-ui-browser-qa.yml']
permissions:
  contents: write
jobs:
  startup-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - run: python coordination/premium-ui-final-20261020/qa_startup_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-startup-probe
          path: coordination/premium-ui-final-20261020/startup-probe/
      - name: Preserve probe on isolated branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coordination/premium-ui-final-20261020/startup-probe
          git diff --cached --quiet || git commit -m 'Preserve real startup diagnostic trace and screen captures'
          git push origin HEAD:work/premium-ui-final-integration-20261020
