name: Cloudflare-only staging multiplayer QA
on:
  push:
    branches: [work/asset-recovery-20261021]
    paths:
      - coordination/qa/cloudflare-only-stage-room-qa.mjs
      - .github/workflows/cloudflare-stage-room-qa.yml
permissions:
  contents: read
jobs:
  isolated-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check coordination/qa/cloudflare-only-stage-room-qa.mjs
      - run: node coordination/qa/cloudflare-only-stage-room-qa.mjs
