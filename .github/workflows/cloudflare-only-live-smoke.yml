name: Cloudflare-only LIVE safe QA
on:
  push:
    branches: [work/asset-recovery-20261021]
    paths:
      - coordination/qa/cloudflare-only-live-ui-smoke.mjs
      - coordination/qa/cloudflare-only-live-assets-smoke.mjs
      - .github/workflows/cloudflare-only-live-smoke.yml
permissions:
  contents: read
jobs:
  live-browser-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check coordination/qa/cloudflare-only-live-ui-smoke.mjs && node --check coordination/qa/cloudflare-only-live-assets-smoke.mjs
      - run: node coordination/qa/cloudflare-only-live-assets-smoke.mjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node coordination/qa/cloudflare-only-live-ui-smoke.mjs
