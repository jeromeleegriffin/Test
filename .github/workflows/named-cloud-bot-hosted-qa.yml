name: Named Cloud Bots hosted staging
on:
  push:
    branches: [work/asset-recovery-20261021]
    paths:
      - coordination/qa/named-cloud-bot-hosted-qa.mjs
      - .github/workflows/named-cloud-bot-hosted-qa.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check coordination/qa/named-cloud-bot-hosted-qa.mjs
      - run: node coordination/qa/named-cloud-bot-hosted-qa.mjs
