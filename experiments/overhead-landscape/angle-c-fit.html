<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>C control placement study</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#080d12;color:ivory;font:14px Georgia}#viewport{position:fixed;inset:0;contain:strict;overflow:hidden}#scene{position:absolute;width:1672px;height:941px;transform-origin:0 0}#scene>img{width:100%;height:100%;position:absolute}.card{position:absolute;height:auto}#dock{position:fixed;width:320px;aspect-ratio:701/290;display:none}#dock>img{position:absolute;width:100%;height:100%}#dock button,#value{position:absolute;background:none;border:0;color:#ffecad;font:bold 24px Georgia;display:grid;place-items:center;padding:0}#minus{left:5%;top:25.17%;width:21.25%;height:34.48%}#plus{left:73.6%;top:25.17%;width:21%;height:34.48%}#value{left:38.37%;top:33.79%;width:23.68%;height:19%}#bid{left:5%;top:60.69%;width:45.08%;height:34.48%}#pass{left:53.92%;top:60.69%;width:40.65%;height:34.48%}#tools{position:fixed;top:6px;left:6px;display:flex;gap:5px}#tools>*{font:14px system-ui;padding:8px;color:ivory;background:#10243a;border:1px solid #baa05a;border-radius:5px}#note{position:fixed;right:6px;bottom:3px;font:11px system-ui;background:#08111bd9;padding:3px}button{touch-action:manipulation}button:focus-visible{outline:2px solid white!important}
</style><div id="viewport"><div id="scene"><img src="assets/angle-c/clean-scene-v1.png"><div id="hand"></div></div></div><div id="dock"><img src="assets/angle-c/bidbox_complete_blank.png"><button id="minus">−5</button><span id="value">105</span><button id="plus">+5</button><button id="bid">BID 105</button><button id="pass">PASS</button></div><div id="tools"><select id="phase" aria-label="Study phase"><option value="bid">Bid placement</option><option value="play">Hand sizing</option></select><select id="count" aria-label="Cards remaining"><option>10</option><option>6</option><option>3</option><option>1</option></select></div><div id="note">Placement study · no game actions</div><script>
const scene=document.querySelector('#scene'),hand=document.querySelector('#hand'),dock=document.querySelector('#dock'),viewport=document.querySelector('#viewport');let amount=105;
function paint(){const bid=document.querySelector('#phase').value==='bid';document.querySelector('#count').disabled=bid;const n=bid?10:+document.querySelector('#count').value;hand.replaceChildren();const width=Math.min(125,620/n),stride=Math.min(width+5,620/Math.max(1,n-1)),span=stride*(n-1)+width;for(let i=0;i<n;i++){const im=new Image();im.src='assets/reference-cards/'+['green-14.png','red-13.png','yellow-12.png','black-10.png'][i%4];im.className='card';im.style.cssText=`left:${836-span/2+i*stride}px;top:${675-width*1.4}px;width:${width}px`;hand.append(im);}fit();}
function fit(){const w=viewport.clientWidth,h=viewport.clientHeight,s=Math.min(w/1672,h/941),x=(w-1672*s)/2,y=(h-941*s)/2;Object.assign(scene.style,{left:x+'px',top:y+'px',transform:`scale(${s})`});const dw=Math.min(320,w-16),dh=dw*290/701;Object.assign(dock.style,{width:dw+'px',left:(w-dw)/2+'px',top:Math.max(50,y+(675-62*1.4)*s-dh-8)+'px',display:document.querySelector('#phase').value==='bid'?'block':'none'});}
function value(delta){amount=Math.max(105,Math.min(195,amount+delta));document.querySelector('#value').textContent=amount;document.querySelector('#bid').textContent='BID '+amount;}
document.querySelector('#minus').onclick=()=>value(-5);document.querySelector('#plus').onclick=()=>value(5);for(const id of ['bid','pass'])document.querySelector('#'+id).onclick=()=>{document.querySelector('#note').textContent='Preview only: '+id+' '+amount+' — no game submitted';};document.querySelector('#phase').onchange=paint;document.querySelector('#count').onchange=paint;new ResizeObserver(fit).observe(viewport);paint();
</script></html>
